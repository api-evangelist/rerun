name: Rerun
description: >-
  Rerun is an open-source data platform — "the unified data layer for physical
  AI" — for multimodal, multi-rate time-series data from robotics and computer
  vision. It provides the data primitives to log, store, query, transform, and
  visualize images, point clouds, tensors, transforms, and other sensor streams
  from initial recording through production scale. The open-source toolchain (a
  logging SDK across Python, Rust, and C++, an interactive desktop/web viewer,
  SQL/dataframe queries, a PyTorch dataloader, the columnar .rrd file format,
  and a local catalog) is free and dual-licensed MIT OR Apache-2.0; Rerun Hub is
  the commercial managed backend adding a persistent catalog, byte-range
  indexing across object stores, dataset streaming to GPUs, SSO, and
  single-tenant deployment. Rerun's programmatic surface is an SDK plus a gRPC
  data server and a Viewer MCP server, rather than a hosted REST API. Backed by
  Costanoa Ventures, Point Nine, and Seedcamp.
